name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          python -m pytest app/tests

  
  sast:
    name: SAST with Bandit
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit scan
        run: |
          bandit -r app -ll

  
  secrets_scan:
    name: Secrets scanning with Gitleaks
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

    
  dependency_scan:
    name: SCA dependency scan with Trivy
    runs-on: ubuntu-latest
    needs: secrets_scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true


  docker_build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - sast
      - secrets_scan
      - dependency_scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t secure-cicd-app:latest .


  container_scan:
    name: Container image scan with Trivy
    runs-on: ubuntu-latest
    needs: docker_build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t secure-cicd-app:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secure-cicd-app:latest"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: true


  deploy_test:
    name: Deploy application in test environment
    runs-on: ubuntu-latest
    needs: container_scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t secure-cicd-app:latest .

      - name: Run application container
        run: |
          docker run -d -p 8000:8000 --name secure-cicd-app secure-cicd-app:latest
          sleep 10

      - name: Check application health
        run: |
          curl --fail http://localhost:8000/health


  dast:
    name: DAST with OWASP ZAP
    runs-on: ubuntu-latest
    needs: deploy_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t secure-cicd-app:latest .

      - name: Run application container
        run: |
          docker run -d -p 8000:8000 --name secure-cicd-app secure-cicd-app:latest
          sleep 10
          curl --fail http://localhost:8000/health

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --network host --user root -v ${{ github.workspace }}:/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8000 \
            -r zap-report.html \
            -I

      - name: Check ZAP report file
        run: |
          pwd
          ls -la
          find . -name "zap-report.html"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html


  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs:
      - tests
      - sast
      - secrets_scan
      - dependency_scan
      - docker_build
      - container_scan
      - deploy_test
      - dast
    if: always()

    steps:
      - name: Send success message
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ CI/CD-конвейер успешно завершён. Проверки безопасности пройдены."

      - name: Send failure message
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ CI/CD-конвейер завершился ошибкой. Необходимо проверить результаты security checks."